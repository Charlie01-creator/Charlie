<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Set theme before first paint to avoid a flash of the wrong theme on load -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("nexora-theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Primary SEO -->
    <title>Nexora Tech — Building The Future Through Technology</title>
    <meta
      name="description"
      content="Nexora Tech builds premium websites, custom software, and AI-powered digital solutions for ambitious businesses. Web development, software engineering, AI automation, and UI/UX design."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="canonical" href="https://www.nexoratech.com/" />

    <!-- Open Graph / Facebook / WhatsApp preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.nexoratech.com/" />
    <meta property="og:title" content="Nexora Tech — Building The Future Through Technology" />
    <meta
      property="og:description"
      content="Premium websites, custom software, and AI-powered digital solutions built for speed and built to last."
    />
    <meta property="og:image" content="https://www.nexoratech.com/og-image.jpg" />
    <meta property="og:site_name" content="Nexora Tech" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexora Tech — Building The Future Through Technology" />
    <meta
      name="twitter:description"
      content="Premium websites, custom software, and AI-powered digital solutions built for speed and built to last."
    />
    <meta name="twitter:image" content="https://www.nexoratech.com/og-image.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Nexora Tech",
        "url": "https://www.nexoratech.com/",
        "logo": "https://www.nexoratech.com/favicon.svg",
        "description": "Nexora Tech builds premium websites, custom software, and AI-powered digital solutions for ambitious businesses.",
        "email": "hello@nexoratech.com",
        "sameAs": []
      }
    </script>

    <!-- Preconnect for the Google Fonts loaded in index.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
